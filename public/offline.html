<!doctype html>
<html lang="uz">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020617" />
  <title>Internet yo'q | 8-Maktab</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --panel: #07122b;
      --blue: #2563eb;
      --blue-bright: #60a5fa;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(37, 99, 235, 0.22), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: "Poppins", "Segoe UI", system-ui, -apple-system, sans-serif;
      text-align: center;
    }

    .card {
      width: min(440px, 100%);
      padding: 32px 26px;
      border-radius: 22px;
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      border: 1px solid rgba(37, 99, 235, 0.4);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.7), 0 0 40px rgba(37, 99, 235, 0.18);
    }

    .icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 62px;
      height: 62px;
      margin-bottom: 14px;
      border-radius: 18px;
      background: rgba(37, 99, 235, 0.18);
      border: 1px solid rgba(96, 165, 250, 0.35);
      color: var(--blue-bright);
      font-size: 30px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 22px;
      line-height: 1.3;
    }

    p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 11px 22px;
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.4);
    }

    button:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="icon" aria-hidden="true">📡</div>
    <h1>Internet aloqasi yo'q</h1>
    <p>
      Qurilmangiz hozir internetga ulanmagan. Ulanish tiklangach, sahifani qayta
      yuklang — maktab yangiliklari yana ochiladi.
    </p>
    <button type="button" onclick="window.location.reload()">Qayta urinish</button>
  </main>
</body>

</html>
